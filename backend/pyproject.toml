[project]
name = "fare-enough"
version = "0.1.0"
description = "The cheapest way to get there, computed."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    # Phase 1b: Postgres-backed job persistence + Redis provider cache.
    # The [asyncio] extra pulls in greenlet, required by sqlalchemy.ext.asyncio.
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",  # Postgres driver
    "aiosqlite>=0.19",  # SQLite driver (local-dev default, tests)
    "redis>=5.0",  # async client; app degrades gracefully without a server
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
