# Dev matches prod: API + Postgres + Redis in one command.
# Phase 1: the API runs against stub providers, so no API keys are needed.
# Phase 1b: wire DATABASE_URL / REDIS_URL from these services into the app.
# Phase 2f: the worker prices trips; scale it with --scale worker=N.

services:
  api:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      # asyncpg scheme: SQLAlchemy's async engine needs an explicit driver.
      - DATABASE_URL=postgresql+asyncpg://fareenough:fareenough@db:5432/fareenough
      - REDIS_URL=redis://redis:6379/0
    # Wait for Postgres to *accept connections*, not just for its container
    # to exist: the lifespan runs init_db() at startup and exits if the
    # database isn't up yet — a race on every cold `docker compose up`.
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    # python:3.12-slim has no curl; urllib is always there. Lets
    # `docker compose up --wait` (CI e2e) block until the API serves.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Job execution lives here, not in the API: POST /trips only enqueues,
  # workers claim pending rows atomically (never double-run). One for dev;
  # `docker compose up --scale worker=3` when the queue grows.
  worker:
    build: ./backend
    environment:
      - DATABASE_URL=postgresql+asyncpg://fareenough:fareenough@db:5432/fareenough
      - REDIS_URL=redis://redis:6379/0
    depends_on:  # same startup race as the api — init_db() runs first
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: python -m app.worker

  db:
    image: postgres:16
    environment:
      - POSTGRES_USER=fareenough
      - POSTGRES_PASSWORD=fareenough
      - POSTGRES_DB=fareenough
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fareenough -d fareenough"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
