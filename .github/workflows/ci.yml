name: ci

on:
  # Branch pushes are already covered by their PR's run; only main needs a
  # push build (it has no PR after merging). Halves the duplicate runs.
  push:
    branches: [main]
  pull_request:

jobs:
  # Unit + in-process integration tests: fast, hermetic, no network.
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "./backend[dev]"
      - run: ruff check backend
      - run: pytest backend/tests -q

  # The web UI has no tests yet; a production build at least catches broken
  # JSX, bad imports and syntax errors before they merge.
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  # The real deployment shape: api + worker + Postgres + Redis as separate
  # containers. Catches what the in-process tests can't — Postgres-only SQL,
  # a worker that never starts, startup races, broken Dockerfile. Asserts
  # structure, not prices (scripts/smoke_test.sh explains why).
  e2e:
    runs-on: ubuntu-latest
    needs: backend  # no point booting the stack if unit tests already failed
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: Smoke test
        env:
          SMOKE_RESTART_CMD: docker compose restart api
        run: scripts/smoke_test.sh http://localhost:8000
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down -v
